services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena_secret
      POSTGRES_DB: arenapulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arenapulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://arena:arena_secret@db:5432/arenapulse
      SECRET_KEY: local-dev-secret-change-in-production
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      DATA_DIR: /data
      STATIC_DIR: static
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
